name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  email-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately fictional public settings. Every request is intercepted by
    # Playwright; no repository secrets, provider or live Supabase project.
    env:
      VITE_SUPABASE_URL: https://email-test.supabase.co
      VITE_SUPABASE_ANON_KEY: public-test-key
      VITE_EMAIL_ENABLED: 'false'
      PLAYWRIGHT_EMAIL_TEST: 'true'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/browser/email-setup-connected.spec.ts tests/browser/email.spec.ts --workers=1 --reporter=line,github
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-setup-failure-details
          path: test-results/
          retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Chromium and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system libraries for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Save installed Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Run browser tests
        run: |
          set +e
          npm run test:e2e -- --reporter=line,github 2>&1 | tee /tmp/praxisraum-browser-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            printf '### Browser test failure\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 180 /tmp/praxisraum-browser-tests.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: bundled
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7
