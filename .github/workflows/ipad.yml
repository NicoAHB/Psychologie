name: Safari engine and tablet recovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    # Match package-lock.json. The official image already contains WebKit and
    # its native libraries; avoid repeating a large apt/browser installation.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ipad -- --reporter=line,github
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-webkit-details
          path: test-results/
          retention-days: 7
