name: Safari engine and tablet recovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  webkit:
    strategy:
      fail-fast: false
      matrix:
        device: [ipad-webkit, iphone-webkit]
    runs-on: ubuntu-24.04
    env:
      # Xvfb has no physical GPU; use WebKit's software rendering path.
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
    # Match package-lock.json. The official image already contains WebKit and
    # its native libraries; avoid repeating a large apt/browser installation.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # This WebKit build can stop requestAnimationFrame entirely in headless
      # mode (confirmed by frame probes); use a real virtual display instead.
      # Keep the normal Playwright visibility/stability checks on every click.
      # Separate runners give each device its own software compositor and disk.
      # workers: 1 still keeps that device's full test suite sequential.
      - run: xvfb-run --auto-servernum npm run test:ipad -- --project=${{ matrix.device }} --headed --reporter=line,github
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-webkit-details-${{ matrix.device }}
          path: test-results/
          retention-days: 7
