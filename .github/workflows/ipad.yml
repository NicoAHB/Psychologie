name: Safari engine and tablet recovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        id: webkit-cache
        with:
          path: ~/.cache/ms-playwright
          key: webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.webkit-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - if: steps.webkit-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - run: npm run test:ipad -- --reporter=line,github
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-webkit-details
          path: test-results/
          retention-days: 7
