name: Publish Praxisraum
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run tests
        run: |
          set +e
          npm test 2>&1 | tee /tmp/praxisraum-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            printf '### Test failure\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 /tmp/praxisraum-tests.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"
      - name: Build for the repository's Pages path
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional public configuration. Never use service-role keys here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REMINDER_PUBLIC_KEY: ${{ vars.VITE_REMINDER_PUBLIC_KEY }}
          VITE_EMAIL_ENABLED: ${{ vars.VITE_EMAIL_ENABLED }}
          VITE_TELEGRAM_ENABLED: ${{ vars.VITE_TELEGRAM_ENABLED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the tested app
        id: deployment
        uses: actions/deploy-pages@v4
